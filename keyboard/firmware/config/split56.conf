# User settings for all three parts (the two halves and the dongle). This file is merged after
# the shield's own settings, so it can override them; the build stops if it raises the LED
# brightness cap above the board's 20 %.

# CONFIG_ZMK_IDLE_TIMEOUT is not set here: this file is merged after the shield's, and the
# halves' idle time must end their lighting's fade. The times are in tools/zmk_generate.py
# (HOLD_MS, FADE_IN_MS, FADE_OUT_MS); the dongle's display blanks after the same 60 s.
