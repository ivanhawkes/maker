# Editable switch-position source for the split keyboard.
#
# This file is the source of truth for switch positions. The left half is
# defined here; the right half is generated by mirroring it (see
# tools/layout.py). Do not edit the generated files in layout/generated/.
#
# Only the 28 switch cutouts per half are intended (owner, 2026-11-22). The
# prototype's Rim sketch/RimPad is a test box for trial fitting, not part of
# the layout.
#
# Provenance: values were read from Sketch in the corrected working CAD,
# cad/left-hand/plate.fcstd, with FreeCAD 1.1.4 on 2026-11-22. That file is a
# copy of the preserved prototype (prototype/left-hand/test-pad.fcstd, sha256
# 112a3d75...3622767) with the two oversized C1 cutouts fixed; see
# `prototype_cad` below. `python tools/layout.py check-cad` compares this file
# with the working CAD (exactly) or, with --fcstd, with the prototype.
#
# Conventions (left half):
#   - Units are millimetres.
#   - The origin is the centre of the 170 x 122 mm prototype plate outline.
#   - +x points towards the user's right and +y away from the user (plan view,
#     looking down on the keycaps).
#   - Rotation is in degrees, counter-clockwise positive, about the key centre.
#     A square cutout's rotation is only defined modulo 90 degrees.
#   - Rows are numbered R1 (top, number row) to R4 (bottom alpha row).

units: mm

defaults:
  cutout: 14.0          # square switch cutout edge length, mm
  row_pitch: 19.05      # centre-to-centre distance along a column, mm

# Each column is a straight run of keys. `top` is the centre of the R1 key;
# each lower row is `row_pitch` further down the column's own axis, which is
# rotated by `rotation` degrees.
columns:
  - id: C0
    finger: outer pinky
    top: [-72.67153, 26.97997]
    rotation: 6.0
    rows: 4
  - id: C1
    finger: pinky
    top: [-53.72589, 28.97124]
    rotation: 6.0
    rows: 4
  - id: C2
    finger: ring
    top: [-27.05, 42.0]
    rotation: 0.0
    rows: 4
  - id: C3
    finger: middle
    top: [-8.0, 48.0]
    rotation: 0.0
    rows: 4
  - id: C4
    finger: index
    top: [11.05, 44.0]
    rotation: 0.0
    rows: 4
  - id: C5
    finger: inner index
    top: [30.1, 42.0]
    rotation: 0.0
    rows: 4

# The thumb keys sit on a circular arc that bulges towards the user's wrist
# and fans outward. `anchor` is the centre of the key at 0 degrees; the arc
# centre is `radius` mm directly below it (-y). A key at rotation `a` sits at
# arc_centre + radius * (-sin a, cos a), and its top edge faces away from the
# arc centre. Positive angles are towards the inside of the hand (-x on the
# left half).
thumb_arc:
  anchor: [30.54, -34.2]
  radius: 83.0
  keys:
    - id: T0
      rotation: 14.0
      note: innermost, under the index finger
    - id: T1
      rotation: 0.0
    - id: T2
      rotation: -14.0
    - id: T3
      rotation: -28.0
      note: outermost

# Known defects of the preserved, printed prototype CAD relative to the
# geometry above. check-cad applies these only when checking the prototype
# file, reporting each key as KNOWN; any other difference still fails.
#
# In the prototype sketch, C1R3 and C1R4 were sized with DistanceX/DistanceY
# (projected) constraints instead of Distance, so on the 6-degree column their
# edges were 14 / cos(6 deg) = 14.07712 mm. The pinky cluster is anchored to
# C2R4 through a corner of C1R3 (DistanceX 8.0, DistanceY 7.0) and C0 is tied
# to C1R4 (collinear edge, gridSpacing), so the oversized squares also shifted
# both pinky columns slightly. The corrected CAD keeps those constraints and
# their round values; the prototype offsets below are the side effect.
#   offset: prototype CAD centre minus the centre above, plan view, mm
#   cutout: prototype cutout edge length, mm (when not the default)
prototype_cad:
  file: prototype/left-hand/test-pad.fcstd
  known_defects:
    C0R1: {offset: [-0.08460, 0.06865]}
    C0R2: {offset: [-0.08460, 0.06865]}
    C0R3: {offset: [-0.08460, 0.06865]}
    C0R4: {offset: [-0.08460, 0.06865]}
    C1R1: {offset: [-0.07668, -0.00822]}
    C1R2: {offset: [-0.07668, -0.00822]}
    C1R3: {offset: [-0.04238, 0.03432], cutout: 14.07712}
    C1R4: {offset: [-0.04238, 0.03432], cutout: 14.07712}

# Deliberate changes from the CAD, applied on top of the geometry above. The
# geometry above stays a faithful reading of the working CAD (check-cad
# verifies it); adjusted keys are reported by check-cad as CHANGED.
#   along_column: mm to slide each listed column along its own axis
#                 (+ = up the column, away from the user; - = towards the user)
#   offset:       [dx, dy] mm plan-view shift of each listed column
adjustments:
  - id: pinky-vertical
    columns: [C0, C1]
    along_column: 0.0
    offset: [0.0, 0.0]
    # Owner, 2026-11-22: the 6 degree fan-out feels right, but the vertical
    # position of the pinky columns is provisional and may change after a
    # printed prototype. Keep both columns moving together unless a test
    # shows otherwise.

# The right half is the left half mirrored about the y axis (x -> -x,
# rotation -> -rotation). Key ids keep their meaning (C0 is the outer pinky
# column on both halves). The mirror is geometric only: PCB footprints,
# connectors and routing are not mirrored by this.
mirror:
  axis: y
